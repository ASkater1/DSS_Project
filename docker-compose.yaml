name: dss_dashboard_supermarkets

services:

  static_importer:
    container_name: static
    build: ./code/importer/static/  # where to find the Dockerfile to construct the image
    env_file:
      - .env
    volumes:
      - ./data/raw:/project/data/raw:ro
    # Currently disabled, as restarting the static importer will always result in compose failing to start.
    #develop:
    #  watch:
    #    - action: sync+restart
    #      path: ./code/importer/static/
    #      target: /app
    #      ignore:
    #        - requirements.txt
    #        - "*.md"
    #        - Dockerfile
    #    - action: rebuild
    #      path: ./code/importer/static/
    #      ignore:
    #        - "*.md"
    #        - "*.py"
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  modelling:
    container_name: modelling
    build: ./code/modelling/  # where to find the Dockerfile to construct the image
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
    depends_on:
      database:
        condition: service_healthy
      static_importer:
        condition: service_completed_successfully
      live:
        condition: service_completed_successfully
    restart: "no"
  basket:
    container_name: basket
    build: ./code/basket/  # where to find the Dockerfile to construct the image
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
    depends_on:
      database:
        condition: service_healthy
      static_importer:
        condition: service_completed_successfully
      live:
        condition: service_completed_successfully
    restart: "no"
  live:
    container_name: live
    build: ./code/importer/live  # where to find the Dockerfile to construct the image
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  visualization:
    container_name: dashboard
    build: ./code/visualization/
    env_file:
      - .env
    develop:
      watch:
        - action: sync+restart
          path: ./code/visualization/
          target: /app
          ignore:
            - requirements.txt
            - "*.md"
            - Dockerfile
        - action: rebuild
          path: ./code/visualization/
          ignore:
            - "*.md"
            - "*.py"
    depends_on:
      database:
        condition: service_healthy
      #static_importer:
      #  condition: service_completed_successfully
    ports:
      - '8501:8501'
    restart: always

  database:
    container_name: ${DB_HOST}
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ./data/db/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql
      - db:/var/lib/postgresql/data
    restart: always
    # temporary open database port to create manually mapping of basket.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 10s
      retries: 5

    
volumes:
  db: #might want to make this persistent with 