  #  build: .
  #  volumes:
  #    - /etc/localtime:/etc/localtime:ro
  #  env_file:
  #    - .env
  #  ports:
  #    - '8501:8501'
  #  depends_on:
  #    - database
  #  restart: always
  #  healthcheck:
  #    disable: true
  static_importer:
    container_name: static
    build: ./code/importer/static/
    env_file:
      - .env
    develop:
      watch:
        - action: sync+restart
          path: ./code/visualization/
          target: /app
          ignore:
            - requirements.txt
            - "*.md"
            - Dockerfile
        - action: rebuild
          path: ./code/visualization/
          ignore:
            - "*.md"
            - "*.py"
    depends_on:
      database:
        condition: service_healthy
    restart: no
  visualization:
    container_name: dashboard
    build: ./code/visualization/
    env_file:
      - .env
    develop:
      watch:
        - action: sync+restart
          path: ./code/visualization/
          target: /app
          ignore:
            - requirements.txt
            - "*.md"
            - Dockerfile
        - action: rebuild
          path: ./code/visualization/
          ignore:
            - "*.md"
            - "*.py"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - '8501:8501'
    restart: always

  database:
    container_name: database
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ./data/db/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql
      - db:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 10s
      retries: 5

    
volumes:
  db: #might want to make this persistent with 